name: Daily Lead Collection

on:
  schedule:
    # 2:00 AM Eastern Time = 7:00 AM UTC (adjust for daylight saving if needed)
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Allows you to run this manually from the GitHub Actions tab anytime

jobs:
  collect-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lead collection
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m leads.main

      - name: Notify on failure
        if: failure()
        run: |
          echo "Lead collection failed. Check the logs above."
          echo "Common causes: Firecrawl credits exhausted, county site structure changed, Google Sheets credentials expired."
